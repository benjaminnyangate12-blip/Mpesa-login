<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa Payment</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #eaf7ec);
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 430px;
      background: #ffffff;
      border-radius: 14px;
      padding: 30px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #0b7a3d;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d3d9d5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0b7a3d;
      box-shadow: 0 0 0 3px rgba(11, 122, 61, 0.12);
    }

    button {
      width: 100%;
      border: none;
      background: #0b7a3d;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border-radius: 10px;
      padding: 13px 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #085d32;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      font-size: 14px;
      text-align: center;
    }

    .error { color: #b42318; }
    .success { color: #0b7a3d; }
  </style>
</head>
<body>
  <div class="container">
    <h2>M-Pesa Payment</h2>
    <p class="subtitle">Enter your phone number and amount. The M-Pesa PIN prompt will appear on your phone.</p>

    <form method="POST" action="/login" novalidate>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" value="{{ phone or '' }}" placeholder="254712345678" required />
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="1" step="0.01" value="{{ amount or '' }}" placeholder="500" required />
      </div>

      <button type="submit">Send M-Pesa Prompt</button>

      {% if error %}
        <p class="message error">{{ error }}</p>
      {% elif success %}
        <p class="message success">{{ success }}</p>
      {% endif %}
    </form>
  </div>
</body>
</html>
